[script://$SPLUNK_HOME/etc/apps/TA-memwatch/bin/memwatch_events.py]
interval = 300
index = main
sourcetype = memwatch:status
source = status
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-memwatch/bin/memwatch_metrics.py]
interval = 300
index = metrics
sourcetype = memwatch:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-memwatch/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-memwatch
disabled = 0
python.version = python3
python.required = 3.13
